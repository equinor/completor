name: Test

on:
  workflow_call: # Enables workflow to be called from another workflow.
  schedule:
    # Run CI every night and check that tests are working with the latest dependencies.
    - cron:  '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: ${{ github.workspace }}/install/lib/python${{ matrix.python-version }}/site-packages:${{ github.workspace }}/install/lib/python${{ matrix.python-version }}/dist-packages

    steps:
      - name: Checkout commit locally
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry==1.8.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"

      - name: Install ERT Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libegl1
        shell: bash

      - name: Install dependencies
        run: |
          poetry install --with dev -E ert --no-interaction
          poetry show

      - name: Run tests in multiprocess
        run: poetry run pytest tests/ -n auto

  pandas-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        pandas-version: ['2.2.*', '2.3.*', '3.*']
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout commit locally
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Completor with pandas ${{ matrix.pandas-version }}
        run: |
          python -m pip install ".[test]" "pandas==${{ matrix.pandas-version }}"
          python -m pip check

      # ERT has its own pandas constraints and is covered by the integration job above.
      - name: Run tests without optional ERT integration
        run: python -m pytest tests/ --ignore=tests/completor/test_hook_implementations.py -n auto
